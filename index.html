<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생산순서 최적화 방법 비교</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div>
    <h1>생산순서 최적화 방법 비교</h1>
    <p id="subtitle">데이터를 불러오는 중…</p>
  </div>
  <button id="btnPresent" type="button">발표 모드</button>
</header>
<div id="banner" class="banner" hidden></div>
<button id="btnExit" type="button" class="exit">설정 열기 (Esc)</button>

<div class="layout">
  <aside class="panel" id="panel">

    <section>
      <h3>1. 데이터 넣기</h3>
      <label class="drop" id="drop">
        results.csv 를 여기에 끌어놓거나 클릭해서 선택
        <input id="fileInput" type="file" accept=".csv,text/csv" hidden>
      </label>
      <p id="loadMsg" class="load-msg"></p>
    </section>

    <section>
      <h3>2. 파라미터</h3>
      <div id="scenarioWrap">
        <label class="field">시나리오 (피커 수 등)
          <select id="scenario"></select>
        </label>
      </div>
      <label class="field">선반 한도 (칸)
        <input id="cap" type="number" min="0" step="1" value="200">
      </label>
      <label class="field">판정 기준 1순위
        <select id="crit1"></select>
      </label>
      <label class="field">2순위
        <select id="crit2"></select>
      </label>
      <label class="field">3순위
        <select id="crit3"></select>
      </label>
    </section>

    <section>
      <h3>3. 방법 선택</h3>
      <div class="btns">
        <button id="mPreset" type="button">대표 6개</button>
        <button id="mAll" type="button">전체</button>
        <button id="mNoRandom" type="button">무작위 빼고</button>
        <button id="mNone" type="button">해제</button>
      </div>
      <div id="methodBox" class="box"></div>
    </section>

    <section>
      <h3>4. 날짜 선택</h3>
      <div class="btns">
        <button id="dAll" type="button">전체</button>
        <button id="dMon" type="button">월요일만</button>
        <button id="dWeek" type="button">평일만</button>
        <button id="dNone" type="button">해제</button>
      </div>
      <div id="dateBox" class="box dates"></div>
    </section>

  </aside>

  <main id="main">
    <section id="kpis" class="kpis"></section>

    <section>
      <h2>방법별 순위</h2>
      <div class="table-wrap"><table id="rankTable"></table></div>
    </section>

    <section>
      <div class="sec-head">
        <h2>지표 비교</h2>
        <select id="barMetric" aria-label="막대그래프 지표"></select>
        <select id="barSort" aria-label="정렬">
          <option value="rank">판정 순위 순</option>
          <option value="value">값 낮은 순</option>
        </select>
      </div>
      <div id="barChart" class="chart"></div>
    </section>

    <section>
      <div class="sec-head">
        <h2>날짜별 추이</h2>
        <select id="lineMetric" aria-label="선그래프 지표"></select>
      </div>
      <div id="lineChart" class="chart"></div>
      <div id="legend" class="legend"></div>
    </section>

    <section id="notes" class="notes"></section>
  </main>
</div>

<script src="data/sample_results.js"></script>
<script src="app.js"></script>
</body>
</html>
